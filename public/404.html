<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Ruprous</title>
    <script>
      // GitHub Pages SPA routing fix
      // Unknown paths are served this 404.html.
      // Save the full path to sessionStorage and redirect to the root.
      var path = window.location.pathname + window.location.search + window.location.hash
      sessionStorage.setItem('spa_redirect', path)
      window.location.replace('/')
    </script>
  </head>
  <body></body>
</html>
